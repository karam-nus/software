title: "Software Engineering for ML — The Complete Guide"
description: "Industry-standard software engineering principles, practices, and tools for ML practitioners and research teams"
baseurl: "/software"
url: "https://karam-nus.github.io"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

include:
  - README.md

navigation:
  - title: "Home"
    url: "/"
  - title: "01 — Software Development Lifecycle"
    url: "/01_software_development_lifecycle"
