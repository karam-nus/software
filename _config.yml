  - title: "03 — Code Quality & Style"
    url: "/03_code_quality_and_style"
  - title: "04 — Testing for ML Software"
    url: "/04_testing_for_ml_software"
  - title: "05 — Design Patterns"
    url: "/05_design_patterns"
  - title: "06 — OOP & Functional Design"
    url: "/06_oop_and_functional_design"
  - title: "07 — API Design & REST"
    url: "/07_api_design_and_rest"
  - title: "08 — Documentation"
    url: "/08_documentation"
  - title: "09 — Dependency & Package Management"
    url: "/09_dependency_and_package_management"
  - title: "10 — Build Systems & Automation"
    url: "/10_build_systems_and_automation"
  - title: "11 — Containerization & Reproducibility"
    url: "/11_containerization_and_reproducibility"
  - title: "12 — Configuration Management"
    url: "/12_configuration_management"
  - title: "13 — Logging, Monitoring & Observability"
    url: "/13_logging_monitoring_and_observability"
  - title: "14 — Error Handling & Debugging"
    url: "/14_error_handling_and_debugging"
  - title: "15 — Code Review & Collaboration"
